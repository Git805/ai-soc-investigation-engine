[project]
name = "ai-soc-investigation-engine"
version = "0.2.0"
description = "AI-assisted SOC triage and investigation engine"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "httpx>=0.27,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.railway]
buildCommand = "pip install ."
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
