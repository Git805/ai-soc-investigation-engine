[project]
name = "ai-soc-investigation-engine"
version = "0.1.0"
description = "AI-assisted SOC triage and investigation engine"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.9,<3", "httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
