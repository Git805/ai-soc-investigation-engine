services:
  - type: web
    name: ai-soc-investigation-engine
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-soc-investigation-db
          property: connectionString

databases:
  - name: ai-soc-investigation-db
    databaseName: soc_investigation
    user: soc_app
    plan: free
