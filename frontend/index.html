<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>AI SOC Investigation Engine</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e8edf7;background:#070b14;--panel:#0d1422;--panel2:#111b2d;--line:#26344f;--muted:#8f9db7;--blue:#6e8bdc;--red:#ef6b73;--orange:#e5a85f;--green:#62c58b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% -10%,#182744 0,#070b14 38%)}header{height:66px;padding:0 28px;border-bottom:1px solid var(--line);background:#0a101cdd;backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:12px}.logo{width:34px;height:34px;border:1px solid #405477;border-radius:9px;display:grid;place-items:center;background:#111c30;font-weight:800;color:#9eb5ff}.brand b{font-size:16px}.sub{color:var(--muted);font-size:13px}.analyst{font-size:12px;color:#b6c2d9;border:1px solid var(--line);background:#10192a;padding:8px 11px;border-radius:8px}main{max-width:1500px;margin:auto;padding:24px}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:18px}.toolbar .spacer{flex:1}button,select{font:inherit;background:#142139;color:#e8edf7;border:1px solid #344564;border-radius:8px;padding:9px 12px;cursor:pointer}button:hover,select:hover{border-color:#6a80ad;background:#192844}.primary{background:#20345e;border-color:#526fae}.grid{display:grid;grid-template-columns:330px minmax(0,1fr);gap:18px}.card{background:linear-gradient(180deg,#101a2b,#0d1524);border:1px solid var(--line);border-radius:13px;box-shadow:0 10px 30px #0003}.side{padding:16px}.sidehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.sidehead h3{margin:0}.count{font-size:11px;color:#b6c2d9;background:#1a2943;padding:4px 7px;border-radius:99px}.list{display:grid;gap:9px}.item{text-align:left;width:100%;padding:12px;border:1px solid #273752;background:#101a2c}.item.active{border-color:#6e8bdc;box-shadow:inset 3px 0 #6e8bdc}.itemtop{display:flex;justify-content:space-between;gap:8px}.itemid{font-weight:750}.classification{color:#b9c5da;font-size:12px;margin-top:4px}.itemmeta{font-size:12px;color:#9aa8c1;margin-top:7px}.severity{font-size:10px;text-transform:uppercase;letter-spacing:.08em;padding:4px 6px;border-radius:5px}.critical{background:#4a1d28;color:#ff9ca4}.high{background:#4a321a;color:#f4c17d}.medium{background:#3f391c;color:#e8d783}.low{background:#183928;color:#8ee0ae}.detail{padding:22px}.detailhead{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.eyebrow{font-size:12px;color:#8fa0bc;text-transform:uppercase;letter-spacing:.12em}.detail h1{font-size:25px;margin:5px 0 8px}.badges{display:flex;gap:6px;flex-wrap:wrap}.badge{display:inline-block;padding:5px 8px;border-radius:99px;background:#1d2c48;color:#c7d4ea;font-size:11px;border:1px solid #2c4164}.riskbox{min-width:150px;text-align:right}.risk{font-size:34px;font-weight:800;line-height:1}.confidence{color:#91a0ba;font-size:12px;margin-top:5px}.riskbar{height:5px;background:#202d42;border-radius:99px;margin-top:10px;overflow:hidden}.riskbar span{display:block;height:100%;background:#d85d6a}.section{margin-top:20px;border-top:1px solid #202d43;padding-top:17px}.section h3{font-size:14px;margin:0 0 10px}.chain{display:flex;flex-wrap:wrap;gap:7px;align-items:center}.chainstep{background:#17243a;border:1px solid #2c4162;border-radius:7px;padding:8px 10px;font-size:12px}.arrow{color:#657691}.timeline{position:relative}.timeline:before{content:"";position:absolute;left:8px;top:8px;bottom:8px;width:1px;background:#30405c}.evidence{position:relative;margin:0 0 9px 0;padding:10px 12px 10px 28px;background:#0c1422;border:1px solid #202e45;border-radius:8px}.evidence:before{content:"";position:absolute;left:5px;top:14px;width:7px;height:7px;border-radius:50%;background:#7189b8;box-shadow:0 0 0 3px #0c1422}.eventline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.eventtype{font-weight:700;font-size:12px}.eventtime{font-size:11px;color:#7f8da6}.eventmeta{font-size:11px;color:#9aa8c1;margin-top:5px}.intel,.mitre{display:flex;gap:7px;flex-wrap:wrap}.ai{background:#111f35;border:1px solid #31476c;border-radius:10px;padding:14px}.ai p{margin:7px 0;color:#c7d1e1;font-size:13px;line-height:1.55}.actions{display:flex;gap:8px;flex-wrap:wrap}.decision{display:flex;gap:8px;flex-wrap:wrap}.decision button{min-width:110px}.footer-note{font-size:11px;color:#71819b;margin-top:10px}.empty{color:var(--muted);padding:20px 4px;font-size:13px}.status{color:var(--muted);font-size:12px}.toast{position:fixed;right:22px;bottom:22px;background:#15233a;border:1px solid #3a5075;border-radius:9px;padding:12px 15px;box-shadow:0 10px 30px #0008;display:none;font-size:13px;z-index:10}.error{color:#ff9ba2}.ok{color:#8be0ad}@media(max-width:950px){.grid{grid-template-columns:1fr}.side{max-height:360px;overflow:auto}.riskbox{text-align:left}.detailhead{flex-direction:column}}@media(max-width:600px){header{padding:0 15px}.sub{display:none}main{padding:14px}.toolbar{flex-wrap:wrap}.toolbar .spacer{display:none}.detail{padding:16px}}
</style>
</head>
<body>
<header><div class="brand"><div class="logo">AI</div><div><b>AI SOC Investigation Engine</b><div class="sub">Analyst Console · AI advisory only</div></div></div><div class="analyst">ANALYST · SOC-01</div></header>
<main>
<div class="toolbar"><button class="primary" onclick="load()">↻ Refresh</button><select id="filter" onchange="renderList()"><option value="all">All investigations</option><option value="likely_malicious">Likely malicious</option><option value="suspicious">Suspicious</option><option value="needs_review">Needs review</option></select><div class="spacer"></div><span id="status" class="status"></span></div>
<div class="grid"><aside class="card side"><div class="sidehead"><h3>Investigation Queue</h3><span id="count" class="count">0</span></div><div id="list" class="list"><span class="empty">Loading investigations…</span></div></aside><section id="detail" class="card detail"><div class="empty">Select an investigation.</div></section></div>
</main><div id="toast" class="toast"></div>
<script>
let data=[],selected=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sev=x=>x.risk_score>=90?'critical':x.risk_score>=70?'high':x.risk_score>=40?'medium':'low';
function notify(msg,good=false){const t=document.getElementById('toast');t.textContent=msg;t.className='toast '+(good?'ok':'error');t.style.display='block';setTimeout(()=>t.style.display='none',2800)}
async function load(){status.textContent='Loading…';try{const r=await fetch('/api/v1/investigations',{cache:'no-store'});if(!r.ok)throw Error('API '+r.status);data=await r.json();status.textContent=`${data.length} investigation${data.length===1?'':'s'}`;renderList();if(selected&&data.some(x=>x.investigation_id===selected.investigation_id))show(selected.investigation_id);else if(data[0])show(data[0].investigation_id);else detail.innerHTML='<div class="empty">No investigations available. Seed the demo scenario to begin.</div>'}catch(e){status.textContent='API unavailable';list.innerHTML='<span class="empty error">Unable to load investigations.</span>';notify(e.message)}}
function renderList(){const f=filter.value;const rows=data.filter(x=>f==='all'||x.classification===f);count.textContent=rows.length;list.innerHTML=rows.length?rows.map(x=>`<button class="item ${selected?.investigation_id===x.investigation_id?'active':''}" onclick="show('${esc(x.investigation_id)}')"><div class="itemtop"><span class="itemid">${esc(x.investigation_id)}</span><span class="severity ${sev(x)}">${sev(x)}</span></div><div class="classification">${esc(x.classification)}</div><div class="itemmeta">Risk <b>${x.risk_score}</b> · ${(x.confidence*100).toFixed(0)}% confidence</div></button>`).join(''):'<span class="empty">No matching investigations.</span>'}
function show(id){selected=data.find(x=>x.investigation_id===id);renderList();if(!selected)return;const x=selected;const events=x.events||[];detail.innerHTML=`<div class="detailhead"><div><div class="eyebrow">Investigation</div><h1>${esc(x.investigation_id)}</h1><div class="badges"><span class="badge">${esc(x.classification)}</span><span class="badge">${events.length} event${events.length===1?'':'s'}</span></div></div><div class="riskbox"><div class="risk">${x.risk_score}</div><div class="confidence">Risk score · ${(x.confidence*100).toFixed(0)}% confidence</div><div class="riskbar"><span style="width:${Math.min(100,Math.max(0,x.risk_score))}%"></span></div></div></div>
<div class="section"><h3>Attack Chain</h3><div class="chain">${x.attack_chain?.length?x.attack_chain.map((a,i)=>`${i?'<span class="arrow">→</span>':''}<span class="chainstep">${esc(a)}</span>`).join(''):'<span class="empty">No correlated attack chain.</span>'}</div></div>
<div class="section"><h3>Evidence / Timeline</h3><div class="timeline">${events.length?events.map(e=>`<div class="evidence"><div class="eventline"><span class="eventtype">${esc(e.event_type)}</span><span class="eventtime">${esc(e.timestamp)}</span></div><div class="eventmeta">${esc(e.event_id)} · ${esc(e.host?.hostname||'unknown host')} ${e.process?.name?'· '+esc(e.process.name):''}</div></div>`).join(''):'<span class="empty">No events.</span>'}</div></div>
<div class="section"><h3>Threat Intelligence</h3><div class="intel">${(x.indicators||[]).length?(x.indicators||[]).map(i=>`<span class="badge">${esc(i.indicator)} · ${esc(i.verdict||i.type||'unknown')}</span>`).join(''):'<span class="empty">No indicators.</span>'}</div></div>
<div class="section"><h3>MITRE ATT&CK</h3><div class="mitre">${(x.mitre_attack||[]).length?(x.mitre_attack||[]).map(m=>`<span class="badge">${esc(m.technique_id)} · ${esc(m.name||m.technique_name||'')}</span>`).join(''):'<span class="empty">No mapped techniques.</span>'}</div></div>
<div class="section"><h3>AI Assessment</h3><div class="ai"><p><b>Assessment:</b> ${esc(x.ai_assessment?.summary||'No assessment available.')}</p><p><b>Scenario:</b> ${esc(x.ai_assessment?.likely_scenario||'Not reported')}</p><p><b>Uncertainty:</b> ${esc((x.ai_assessment?.uncertainty||[]).join('; ')||'None reported')}</p><h4>Recommended analyst actions</h4><div class="actions">${(x.ai_assessment?.recommendations||[]).map(r=>`<button onclick="recommend(${JSON.stringify(r.action)},${JSON.stringify(r.rationale)})">${esc(r.action)}</button>`).join('')||'<span class="empty">None.</span>'}</div></div></div>
<div class="section"><h3>Analyst Decision</h3><div class="decision"><button onclick="decide('approve')">Approve</button><button class="primary" onclick="decide('escalate')">Escalate</button><button onclick="decide('decline')">Decline</button></div><div class="footer-note">AI recommendations are advisory. No containment action is executed automatically.</div></div>`}
function recommend(a,r){notify(a+' — '+r,true)}
async function decide(d){if(!selected)return;try{const r=await fetch(`/api/v1/investigations/${encodeURIComponent(selected.investigation_id)}/decision?decision=${d}&analyst=SOC-01`,{method:'POST'});const j=await r.json();if(!r.ok)throw Error(j.detail||'Decision failed');notify(`Decision recorded: ${j.decision}`,true)}catch(e){notify(e.message)}}
load();
</script></body></html>
