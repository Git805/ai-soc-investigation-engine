<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>AI SOC Investigation Engine</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#e7eaf3;background:#080d18}*{box-sizing:border-box}body{margin:0}header{padding:18px 24px;border-bottom:1px solid #26304a;background:#0d1424;position:sticky;top:0;z-index:2}main{max-width:1400px;margin:auto;padding:22px}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:18px}button,select{background:#18233a;color:#e7eaf3;border:1px solid #33415f;border-radius:8px;padding:9px 12px;cursor:pointer}.grid{display:grid;grid-template-columns:360px 1fr;gap:18px}.card{background:#10192b;border:1px solid #26304a;border-radius:12px;padding:16px}.list{display:grid;gap:8px}.item{text-align:left;width:100%;padding:12px;border:1px solid #26304a;background:#121d32}.item.active{border-color:#6e8bdc}.muted{color:#8f9ab3}.risk{font-size:30px;font-weight:750;margin:8px 0}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#253552;margin-right:5px;font-size:12px}.section{margin-top:16px}.evidence{border-left:3px solid #4d628d;padding:8px 12px;margin:7px 0;background:#0d1525}.actions{display:flex;gap:8px;flex-wrap:wrap}pre{white-space:pre-wrap;overflow:auto;font-size:12px}@media(max-width:900px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><b>AI SOC Investigation Engine</b> <span class="muted">· Analyst Console · AI advisory only</span></header>
<main>
<div class="toolbar"><button onclick="load()">↻ Refresh</button><select id="filter" onchange="renderList()"><option value="all">All investigations</option><option value="likely_malicious">Likely malicious</option><option value="suspicious">Suspicious</option><option value="needs_review">Needs review</option></select><span id="status" class="muted"></span></div>
<div class="grid"><aside class="card"><h3>Investigations</h3><div id="list" class="list">Loading…</div></aside><section id="detail" class="card">Select an investigation.</section></div>
</main>
<script>
let data=[],selected=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){const r=await fetch('/api/v1/investigations');if(!r.ok){status.textContent='API error '+r.status;return}data=await r.json();status.textContent=data.length+' investigation(s)';renderList();if(selected)show(selected.investigation_id);else if(data[0])show(data[0].investigation_id)}
function renderList(){const f=filter.value;const rows=data.filter(x=>f==='all'||x.classification===f);list.innerHTML=rows.length?rows.map(x=>`<button class="item ${selected?.investigation_id===x.investigation_id?'active':''}" onclick="show('${esc(x.investigation_id)}')"><b>${esc(x.investigation_id)}</b><br><span class="muted">${esc(x.classification)}</span><br>Risk <b>${x.risk_score}</b> · ${(x.confidence*100).toFixed(0)}%</button>`).join(''):'<span class="muted">No matching investigations.</span>'}
function show(id){selected=data.find(x=>x.investigation_id===id);renderList();if(!selected)return;const x=selected;detail.innerHTML=`<h2>${esc(x.investigation_id)}</h2><span class="badge">${esc(x.classification)}</span><span class="badge">${x.events?.length||0} events</span><div class="risk">Risk ${x.risk_score} <span class="muted">· ${(x.confidence*100).toFixed(0)}% confidence</span></div><div class="section"><h3>Attack chain</h3><p>${x.attack_chain?.length?x.attack_chain.map(esc).join(' → '):'No correlated attack chain'}</p></div><div class="section"><h3>Evidence / timeline</h3>${(x.events||[]).map(e=>`<div class="evidence"><b>${esc(e.timestamp)}</b> · ${esc(e.event_type)} · ${esc(e.event_id)}<br><span class="muted">${esc(e.host?.hostname||'unknown host')} · ${esc(e.process?.name||'')}</span></div>`).join('')||'<span class="muted">No events.</span>'}</div><div class="section"><h3>Threat intelligence</h3>${(x.indicators||[]).map(i=>`<span class="badge">${esc(i.indicator)} · ${esc(i.verdict||i.type||'unknown')}</span>`).join('')||'<span class="muted">No indicators.</span>'}</div><div class="section"><h3>MITRE ATT&CK</h3>${(x.mitre_attack||[]).map(m=>`<span class="badge">${esc(m.technique_id)} ${esc(m.name||m.technique_name||'')}</span>`).join('')||'<span class="muted">None.</span>'}</div><div class="section"><h3>AI assessment</h3><p>${esc(x.ai_assessment?.summary||'')}</p><p><b>Scenario:</b> ${esc(x.ai_assessment?.likely_scenario||'')}</p><p><b>Uncertainty:</b> ${esc((x.ai_assessment?.uncertainty||[]).join('; ')||'None reported')}</p><h4>Recommended analyst actions</h4><div class="actions">${(x.ai_assessment?.recommendations||[]).map(r=>`<button onclick="alert(${JSON.stringify(r.action+'\n\n'+r.rationale)})">${esc(r.action)}</button>`).join('')}</div></div><div class="section"><h3>Analyst decision</h3><div class="actions"><button onclick="decide('approve')">Approve</button><button onclick="decide('escalate')">Escalate</button><button onclick="decide('decline')">Decline</button></div></div>`}
async function decide(d){if(!selected)return;const r=await fetch(`/api/v1/investigations/${encodeURIComponent(selected.investigation_id)}/decision?decision=${d}`,{method:'POST'});const j=await r.json();alert(`Decision: ${j.decision}\nAuthorized: ${j.authorized}\nActions executed: ${(j.actions_executed||[]).length}`)}
load();
</script></body></html>
