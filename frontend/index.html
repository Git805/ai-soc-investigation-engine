<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>AI SOC Investigation Engine</title><style>body{font-family:system-ui;margin:0;background:#0b1020;color:#e7eaf3}header{padding:24px;border-bottom:1px solid #26304a}main{padding:24px;max-width:1200px;margin:auto}.card{background:#121a2d;border:1px solid #26304a;border-radius:12px;padding:18px;margin:12px 0}button{padding:10px 14px;border:0;border-radius:8px;cursor:pointer}.risk{font-size:28px;font-weight:700}pre{white-space:pre-wrap}</style></head><body><header><b>AI SOC Investigation Engine</b> · Analyst Console</header><main><button onclick="load()">Refresh investigations</button><div id="app"></div></main><script>async function load(){const r=await fetch('/api/v1/investigations');const data=await r.json();document.getElementById('app').innerHTML=data.length?data.map(x=>`<section class="card"><div><b>${x.investigation_id}</b> — ${x.classification}</div><div class="risk">Risk ${x.risk_score} · ${(x.confidence*100).toFixed(0)}%</div><p>${x.attack_chain.join(' → ')||'No correlated attack chain'}</p><p><b>MITRE:</b> ${x.mitre_attack.map(m=>m.technique_id+' '+m.name).join(', ')||'None'}</p><p><b>Indicators:</b> ${x.indicators.map(i=>i.indicator+' ('+i.type+')').join(', ')||'None'}</p><pre>${JSON.stringify(x.ai_assessment,null,2)}</pre></section>`).join(''):'<div class="card">No investigations yet. POST events first.</div>'}load()</script></body></html>
