name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e './backend[test]'
      - run: cd backend && pytest -q

  deployment-gate:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Railway deployment image
        run: docker build -f backend/Dockerfile -t soc-investigation-engine:ci .

      - name: Start deployment image
        run: |
          docker run -d --rm --name soc-investigation-engine-ci -p 18000:8000 soc-investigation-engine:ci
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18000/health; then
              echo
              echo "Deployment smoke test passed"
              exit 0
            fi
            sleep 2
          done
          echo "Deployment smoke test failed"
          docker logs soc-investigation-engine-ci
          exit 1

      - name: Stop deployment image
        if: always()
        run: docker stop soc-investigation-engine-ci || true
